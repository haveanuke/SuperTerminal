[package]
name = "superterminal"
version = "0.3.2"
description = "A modern multi-terminal manager with splits, tabs, and grid layouts"
edition = "2021"

[lib]
name = "superterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
