<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SuperTerminal Companion</title>
<style>
  :root { --bg:#14141b; --panel:#1d1d27; --border:#2c2c3a; --text:#c8cbe0; --muted:#7d8199; --accent:#7aa2f7; --busy:#e0af68; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font:14px -apple-system,system-ui,sans-serif; }
  .hidden { display:none !important; }
  header { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border); background:var(--panel); position:sticky; top:0; z-index:2; }
  header .title { font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.on { background:#9ece6a; }
  .dot.busy { background:var(--busy); }
  button.back { background:none; border:none; color:var(--accent); font-size:15px; padding:8px; min-width:44px; min-height:44px; }
  #sessions { list-style:none; }
  #sessions li { display:flex; align-items:center; gap:12px; padding:16px 14px; border-bottom:1px solid var(--border); min-height:56px; }
  #sessions li .label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sessions li .chev { color:var(--muted); }
  #sessions li .edit { background:none; border:none; color:var(--muted); min-width:40px; min-height:40px; }
  #sessions li .edit svg { width:14px; height:14px; vertical-align:middle; }
  /* The terminal screen is a full-height column: header and key pad keep
     their natural size, the grid area takes every remaining pixel and does
     its own 2D scrolling. */
  #term { display:flex; flex-direction:column; height:100vh; height:100dvh; }
  #gridwrap { flex:1 1 0; overflow:auto; -webkit-overflow-scrolling:touch; padding:8px; }
  #grid { position:relative; font-family:"SF Mono",Menlo,monospace; font-size:11px; line-height:1; }
  #grid span { position:absolute; white-space:pre; }
  #cursor { position:absolute; outline:1px solid var(--accent); pointer-events:none; }
  #inputs { position:sticky; bottom:0; background:var(--panel); border-top:1px solid var(--border); padding:8px; display:flex; flex-wrap:wrap; gap:6px; z-index:2; }
  #keys { display:flex; flex-wrap:wrap; gap:6px; width:100%; }
  #inputs.compact #keys { display:none; }
  #inputs.compact #padtoggle svg { transform:rotate(180deg); }
  #inputs button { min-width:44px; min-height:44px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font:13px -apple-system,system-ui,sans-serif; }
  #inputs button:active { background:var(--accent); color:var(--bg); }
  #inputs svg { width:16px; height:16px; vertical-align:middle; }
  #textrow { display:flex; gap:6px; width:100%; }
  #textbox { flex:1; min-height:44px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); padding:0 10px; font-size:16px; }
  #send { min-width:64px; }
  .notice { padding:32px 20px; color:var(--muted); text-align:center; }
  #previews { display:flex; flex-direction:column; height:100dvh; }
  #pwrap { flex:1 1 0; overflow:auto; -webkit-overflow-scrolling:touch; }
  #pgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px; }
  #pgrid .tile { background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  #pgrid .tile img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:var(--bg); }
  #pgrid .tile .cap { padding:6px 8px; font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #pfull { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:3; display:flex; flex-direction:column; }
  #pfullwrap { flex:1 1 0; overflow:auto; -webkit-overflow-scrolling:touch; }
  #pfullwrap img { display:block; margin:auto; max-width:100%; }
  #pfullwrap img.zoomed { max-width:none; width:250%; }
  #pfullcap { padding:10px 14px; font-size:12px; color:var(--muted); text-align:center; }
  .dot.attn { background:var(--accent); animation:attnpulse 1.2s ease-in-out infinite; }
  @keyframes attnpulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.45; transform:scale(1.35); } }
  #attnbanner { position:absolute; left:14px; right:14px; top:8px; z-index:3; background:var(--panel);
    border:1px solid var(--accent); border-radius:8px; padding:10px 12px; font-size:13px; }
  #jumplive { position:absolute; right:14px; bottom:14px; width:40px; height:40px; border-radius:50%;
    background:var(--panel); border:1px solid var(--border); color:var(--accent); z-index:2;
    display:flex; align-items:center; justify-content:center; }
  #jumplive svg { width:18px; height:18px; }
  #gridarea { position:relative; flex:1 1 0; display:flex; flex-direction:column; min-height:0; }
</style>
</head>
<body>
<div id="badlink" class="notice hidden">This link is missing its access key. Open the full companion URL (with the part after #) from SuperTerminal's bottom bar.</div>

<div id="list">
  <header>
    <div class="title">SuperTerminal</div>
    <button class="back" id="previewsbtn" aria-label="previews">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 10l3-3 3 3 2-2 4 4"/></svg>
    </button>
    <button class="back" id="newterm" aria-label="new terminal">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <div id="listdot" class="dot"></div>
  </header>
  <ul id="sessions"></ul>
  <div id="empty" class="notice hidden">No sessions.</div>
</div>

<div id="term" class="hidden">
  <header>
    <button class="back" id="back" aria-label="back">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <div class="title" id="termtitle"></div>
    <button class="back" id="zoomout" aria-label="smaller text">A-</button>
    <button class="back" id="zoomin" aria-label="larger text">A+</button>
    <div id="termdot" class="dot"></div>
  </header>
  <div id="gridarea">
    <div id="gridwrap"><div id="grid"><div id="cursor" class="hidden"></div></div></div>
    <button id="jumplive" class="hidden" aria-label="jump to live">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5l5 5 5-5"/><path d="M3 9l5 5 5-5" opacity=".45"/></svg>
    </button>
    <div id="attnbanner" class="hidden"></div>
  </div>
  <div id="inputs">
    <div id="keys">
      <button data-key="enter">Enter</button>
      <button data-key="ctrl-c">Ctrl+C</button>
      <button data-key="up" aria-label="up"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l5-5 5 5"/></svg></button>
      <button data-key="down" aria-label="down"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l5 5 5-5"/></svg></button>
      <button data-key="left" aria-label="left"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3 5 8l5 5"/></svg></button>
      <button data-key="right" aria-label="right"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg></button>
      <button data-key="tab">Tab</button>
      <button data-key="esc">Esc</button>
      <button data-key="y">y</button>
      <button data-key="n">n</button>
    </div>
    <div id="textrow">
      <button id="padtoggle" aria-label="toggle key pad"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l5 5 5-5"/></svg></button>
      <input id="textbox" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type a command">
      <button id="send">Send</button>
    </div>
  </div>
</div>

<div id="previews" class="hidden">
  <header>
    <button class="back" id="pback" aria-label="back">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <div class="title">Previews</div>
    <div id="pdot" class="dot"></div>
  </header>
  <div id="pwrap">
    <div id="pgrid"></div>
    <div id="pempty" class="notice hidden">No images yet.</div>
    <div id="punavailable" class="notice hidden"></div>
  </div>
</div>
<div id="pfull" class="hidden">
  <header>
    <button class="back" id="pfullclose" aria-label="close">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l10 10M13 3 3 13"/></svg>
    </button>
    <div class="title" id="pfulltitle"></div>
  </header>
  <div id="pfullwrap"><img id="pfullimg" alt=""></div>
  <div id="pfullcap"></div>
</div>

<script>
(function () {
  "use strict";
  var token = location.hash.replace(/^#/, "");
  if (!token) { document.getElementById("badlink").classList.remove("hidden"); document.getElementById("list").classList.add("hidden"); return; }
  var $ = function (id) { return document.getElementById(id); };
  var current = null, source = null, lastSnap = null, lastTouch = 0;

  // Per-device view preferences; storage can be absent (private mode) so
  // every access is guarded and the defaults must always work.
  function loadPref(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function storePref(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  // Manual text size (px), 0 = fit-to-width. Stored absolutely: steps
  // relative to a moving fit re-clamp into dead zones; a size does not.
  var userSize = (function () {
    var v = parseFloat(loadPref("st-size"));
    return v >= 5 && v <= 18 ? v : 0;
  })();
  if (loadPref("st-pad") === "1") $("inputs").classList.add("compact");

  function api(path) { return path + (path.indexOf("?") < 0 ? "?" : "&") + "t=" + encodeURIComponent(token); }

  // "Needs attention": a room that flipped busy -> idle while you weren't
  // looking at it. Pulses its list dot until opened; while you're inside
  // another terminal, a tappable banner announces it.
  var lastBusy = {}, attention = {}, bannerTimer = null;
  function showBanner(session) {
    var banner = $("attnbanner");
    banner.textContent = session.label + " finished — tap to switch";
    banner.classList.remove("hidden");
    banner.onclick = function () {
      banner.classList.add("hidden");
      close();
      open(session);
    };
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function () { banner.classList.add("hidden"); }, 8000);
  }
  function markAttention(sessions) {
    sessions.forEach(function (s) {
      var was = lastBusy[s.id];
      lastBusy[s.id] = s.busy;
      if (was && !s.busy && s.alive && (!current || current.id !== s.id)) {
        attention[s.id] = true;
        if (current) showBanner(s);
      }
    });
    Object.keys(lastBusy).forEach(function (id) {
      if (!sessions.some(function (s) { return s.id === id; })) {
        delete lastBusy[id];
        delete attention[id];
      }
    });
  }

  function refreshSessions() {
    fetch(api("/sessions"), { headers: { "X-Companion-Token": token } })
      .then(function (r) {
        if (r.status === 404) { $("badlink").classList.remove("hidden"); $("list").classList.add("hidden"); throw 0; }
        if (!r.ok) throw 0;
        $("listdot").classList.add("on");
        return r.json();
      })
      .then(function (sessions) {
        markAttention(sessions);
        var list = $("sessions"); list.textContent = "";
        $("empty").classList.toggle("hidden", sessions.length > 0);
        sessions.forEach(function (s) {
          var li = document.createElement("li");
          var dot = document.createElement("div");
          dot.className = "dot" + (s.busy ? " busy" : s.alive ? " on" : "")
            + (attention[s.id] ? " attn" : "");
          var label = document.createElement("div"); label.className = "label"; label.textContent = s.label;
          var edit = document.createElement("button");
          edit.className = "edit";
          edit.setAttribute("aria-label", "rename");
          edit.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.5 2.5l2 2L5 13l-2.7.7.7-2.7z"/></svg>';
          edit.addEventListener("click", function (event) { event.stopPropagation(); promptRename(s); });
          var chev = document.createElement("div"); chev.className = "chev"; chev.textContent = ">";
          li.appendChild(dot); li.appendChild(label); li.appendChild(edit); li.appendChild(chev);
          li.addEventListener("click", function () { open(s); });
          list.appendChild(li);
        });
      })
      .catch(function () { $("listdot").classList.remove("on"); });
  }

  // Fixed-grid rendering: measure one cell, position every run absolutely —
  // the phone's font metrics can never drift columns.
  var cw = 0, lh = 0, perPx = 0, fitFor = 0, lastSize = 0, progScroll = null;
  function measure() {
    var probe = document.createElement("span");
    probe.textContent = "MMMMMMMMMM";
    $("grid").appendChild(probe);
    var rect = probe.getBoundingClientRect();
    cw = rect.width / 10; lh = Math.ceil(rect.height) + 2;
    probe.remove();
  }
  // Cell width per px of font size, measured once at a reference size.
  function measurePerPx() {
    var probe = document.createElement("span");
    probe.textContent = "MMMMMMMMMM";
    probe.style.fontSize = "11px";
    $("grid").appendChild(probe);
    perPx = probe.getBoundingClientRect().width / 10 / 11;
    probe.remove();
  }
  // Largest font that shows a full host row in availW, floored so a very
  // wide host grid stays readable and pans instead of shrinking away.
  function fitSize(cols, availW, per) {
    return Math.max(6, Math.min(14, availW / (cols * per)));
  }
  function applyFit(cols) {
    if (!perPx) measurePerPx();
    var avail = Math.max(120, $("gridwrap").clientWidth - 16);
    var size = userSize || fitSize(cols, avail, perPx);
    lastSize = size;
    $("grid").style.fontSize = size.toFixed(2) + "px";
    measure();
    fitFor = cols;
  }
  // Keep fresh output visible: unless the user touched the grid in the last
  // few seconds, bring the cursor (or the bottom) into view each frame.
  function follow() {
    if (Date.now() - lastTouch < 4000) return;
    var wrap = $("gridwrap");
    var top = wrap.scrollTop, left = wrap.scrollLeft;
    if (lastSnap && lastSnap.cursor) {
      // The history tail sits above the live rows, so the cursor's DOM
      // position is offset by its height.
      var hlen = lastSnap.history ? lastSnap.history.length : 0;
      var ctop = (hlen + lastSnap.cursor.row) * lh;
      if (ctop < top || ctop + lh > top + wrap.clientHeight)
        top = Math.max(0, ctop + lh + 8 - wrap.clientHeight);
      var cleft = lastSnap.cursor.col * cw;
      if (cleft < left || cleft + cw > left + wrap.clientWidth)
        left = Math.max(0, cleft + cw + 8 - wrap.clientWidth);
    } else {
      top = wrap.scrollHeight;
    }
    if (top !== wrap.scrollTop || left !== wrap.scrollLeft) {
      wrap.scrollTop = top;
      wrap.scrollLeft = left;
      // Remember the (post-clamp) programmed position so the scroll
      // listener can tell our scrolls from the user's.
      progScroll = { top: wrap.scrollTop, left: wrap.scrollLeft };
    }
  }

  // Row-level DOM patching: one absolutely-positioned container per row —
  // the history tail first (dimmed), then the live grid — rebuilt only when
  // that row's runs changed (compared by their JSON signature). A streaming
  // frame usually touches a handful of rows; the rest keep their DOM nodes.
  // Cols/font changes reset everything; row-count changes (history filling
  // in, resizes) just grow or trim the container list in place.
  var HIST_DIM = "0.62";
  var rowEls = [], rowSigs = [], gridShape = "", cursorEl = null;
  function resetGrid() {
    var grid = $("grid");
    grid.textContent = "";
    rowEls = []; rowSigs = [];
    // Cursor first: spans paint over the outline, as before.
    cursorEl = document.createElement("div");
    cursorEl.id = "cursor";
    cursorEl.className = "hidden";
    grid.appendChild(cursorEl);
  }
  function ensureRows(count) {
    var grid = $("grid");
    while (rowEls.length < count) {
      var rowEl = document.createElement("div");
      rowEl.style.position = "absolute";
      rowEl.style.left = "0";
      rowEl.style.top = rowEls.length * lh + "px";
      rowEl.style.height = lh + "px";
      grid.appendChild(rowEl);
      rowEls.push(rowEl); rowSigs.push("");
    }
    while (rowEls.length > count) {
      $("grid").removeChild(rowEls.pop());
      rowSigs.pop();
    }
  }
  function patchRow(index, runs, dim) {
    // The dim flag joins the signature so a container flips style when a
    // row crosses the history/live boundary.
    var sig = (dim ? "d" : "l") + JSON.stringify(runs);
    if (sig === rowSigs[index]) return;
    rowSigs[index] = sig;
    var rowEl = rowEls[index];
    rowEl.style.opacity = dim ? HIST_DIM : "";
    rowEl.textContent = "";
    runs.forEach(function (run) {
      var span = document.createElement("span");
      span.textContent = run.text;
      span.style.left = run.col * cw + "px";
      span.style.top = "0px";
      span.style.width = run.width * cw + "px";
      span.style.overflow = "hidden";
      span.style.color = run.fg;
      if (run.bg) { span.style.background = run.bg; span.style.height = lh + "px"; }
      if (run.b) span.style.fontWeight = "700";
      if (run.i) span.style.fontStyle = "italic";
      if (run.u) span.style.textDecoration = "underline";
      rowEl.appendChild(span);
    });
  }
  function render(snap) {
    lastSnap = snap;
    var grid = $("grid");
    if (snap.cols !== fitFor || !cw) applyFit(snap.cols);
    if (snap.error) { grid.textContent = snap.error; gridShape = ""; return; }
    var hist = snap.history || [];
    var h = hist.length;
    grid.style.width = snap.cols * cw + "px";
    grid.style.height = (h + snap.lines) * lh + "px";
    var shape = snap.cols + "@" + lastSize;
    if (shape !== gridShape) { gridShape = shape; resetGrid(); }
    ensureRows(h + snap.rows.length);
    hist.forEach(function (runs, row) { patchRow(row, runs, true); });
    snap.rows.forEach(function (runs, row) { patchRow(h + row, runs, false); });
    if (snap.cursor) {
      cursorEl.classList.remove("hidden");
      cursorEl.style.left = snap.cursor.col * cw + "px";
      cursorEl.style.top = (h + snap.cursor.row) * lh + "px";
      cursorEl.style.width = cw + "px";
      cursorEl.style.height = lh + "px";
    } else {
      cursorEl.classList.add("hidden");
    }
    follow();
  }

  // ---- Rename ----------------------------------------------------------
  // Native prompt keeps this dependency-free; the Mac applies the rename on
  // its next tick, so the list refreshes shortly after the 202.
  function promptRename(session) {
    var name = window.prompt("Rename terminal", session.label);
    if (name === null) return;
    // Mirror the server: trim, cap at 64 characters (code points, matching
    // the host's char cap) — the optimistic title must equal what the Mac
    // actually stores.
    name = Array.from(name.trim()).slice(0, 64).join("");
    if (!name) return;
    fetch("/rename/" + encodeURIComponent(session.id), {
      method: "POST",
      headers: { "X-Companion-Token": token, "Content-Type": "application/companion-input" },
      body: JSON.stringify({ label: name }),
    }).then(function (r) {
      if (!r.ok) return;
      if (current && current.id === session.id) {
        current.label = name;
        $("termtitle").textContent = name;
      }
      setTimeout(refreshSessions, 900);
    }).catch(function () {});
  }
  $("termtitle").addEventListener("click", function () {
    if (current) promptRename(current);
  });

  // ---- Previews screen -------------------------------------------------
  var previewTimer = null, tileEls = {};
  function previewsVisible() { return !$("previews").classList.contains("hidden"); }
  function imgSrc(entry, thumb) {
    return api("/preview/" + encodeURIComponent(entry.id)) +
      "&rev=" + encodeURIComponent(entry.revision) + (thumb ? "&thumb=1" : "");
  }
  // A 202 (thumb still rendering) surfaces as an <img> error: retry with a
  // capped backoff instead of leaving a broken tile.
  function loadThumb(img, entry, attempt) {
    img.dataset.rev = entry.revision;
    img.onerror = function () {
      if (attempt < 8 && previewsVisible() && img.dataset.rev === entry.revision) {
        setTimeout(function () { loadThumb(img, entry, attempt + 1); }, 1000);
      }
    };
    img.src = imgSrc(entry, true) + "&a=" + attempt;
  }
  function renderPreviews(data) {
    $("pdot").classList.add("on");
    var unavailable = data.state !== "ok";
    $("punavailable").classList.toggle("hidden", !unavailable);
    if (unavailable) {
      $("punavailable").textContent =
        "Preview folder unavailable. Save renders into Pictures/SuperTerminal on the Mac (or set a folder in settings).";
      $("pgrid").textContent = ""; tileEls = {};
      $("pempty").classList.add("hidden");
      return;
    }
    $("pempty").classList.toggle("hidden", data.entries.length > 0);
    var grid = $("pgrid"), seen = {};
    data.entries.forEach(function (entry) {
      seen[entry.id] = true;
      var tile = tileEls[entry.id];
      if (!tile) {
        tile = document.createElement("div");
        tile.className = "tile";
        var img = document.createElement("img");
        img.alt = entry.name;
        var cap = document.createElement("div");
        cap.className = "cap";
        tile.appendChild(img); tile.appendChild(cap);
        tile.addEventListener("click", function () { openFull(tile.entry); });
        tileEls[entry.id] = tile;
        loadThumb(img, entry, 0);
      } else if (tile.entry.revision !== entry.revision) {
        loadThumb(tile.firstChild, entry, 0);
      }
      tile.entry = entry;
      tile.children[1].textContent = entry.name;
      grid.appendChild(tile); // re-appending keeps newest-first order
    });
    Object.keys(tileEls).forEach(function (id) {
      if (!seen[id]) { grid.removeChild(tileEls[id]); delete tileEls[id]; }
    });
  }
  function refreshPreviews() {
    fetch(api("/previews"), { headers: { "X-Companion-Token": token } })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(renderPreviews)
      .catch(function () { $("pdot").classList.remove("on"); });
  }
  function openPreviews() {
    $("list").classList.add("hidden");
    $("previews").classList.remove("hidden");
    refreshPreviews();
    previewTimer = setInterval(refreshPreviews, 5000);
  }
  function closePreviews() {
    clearInterval(previewTimer); previewTimer = null;
    $("previews").classList.add("hidden");
    $("list").classList.remove("hidden");
    refreshSessions();
  }
  function openFull(entry) {
    $("pfull").classList.remove("hidden");
    $("pfulltitle").textContent = entry.name;
    $("pfullcap").textContent = new Date(entry.modifiedAt * 1000).toLocaleString();
    var img = $("pfullimg");
    img.classList.remove("zoomed");
    // Over-64MiB sources answer 413: show the spec's copy instead.
    img.onerror = function () { $("pfullcap").textContent = "too large — open on Mac"; };
    img.src = imgSrc(entry, false);
  }
  $("previewsbtn").addEventListener("click", openPreviews);
  $("pback").addEventListener("click", closePreviews);
  $("pfullclose").addEventListener("click", function () {
    $("pfull").classList.add("hidden");
    $("pfullimg").src = "";
  });
  // Double-tap toggles fit/2.5x (the viewport meta pins page zoom off).
  var lastTap = 0;
  $("pfullimg").addEventListener("click", function () {
    var now = Date.now();
    if (now - lastTap < 350) this.classList.toggle("zoomed");
    lastTap = now;
  });

  var lastFrame = "";
  function open(session) {
    current = session;
    delete attention[session.id];
    $("attnbanner").classList.add("hidden");
    fitFor = 0; // re-fit: viewport may have rotated since the last view
    lastFrame = "";
    $("termtitle").textContent = session.label;
    $("list").classList.add("hidden");
    $("term").classList.remove("hidden");
    source = new EventSource(api("/stream/" + encodeURIComponent(session.id)));
    source.onopen = function () { $("termdot").classList.add("on"); };
    source.onerror = function () {
      $("termdot").classList.remove("on");
      // A revoked token ("new link") must not strand this view on stale
      // output: probe the API and surface the bad-link state on 404.
      fetch(api("/sessions"), { headers: { "X-Companion-Token": token } }).then(function (r) {
        if (r.status === 404) {
          if (source) { source.close(); source = null; }
          $("term").classList.add("hidden");
          $("list").classList.add("hidden");
          $("badlink").classList.remove("hidden");
        }
      }).catch(function () {});
    };
    source.onmessage = function (event) {
      if (event.data === lastFrame) return; // reconnect can replay a frame
      lastFrame = event.data;
      try { render(JSON.parse(event.data)); } catch (e) {}
    };
  }

  function close() {
    if (source) { source.close(); source = null; }
    current = null;
    lastSnap = null;
    $("term").classList.add("hidden");
    $("list").classList.remove("hidden");
    refreshSessions();
  }

  function post(body) {
    if (!current) return;
    fetch("/input/" + encodeURIComponent(current.id), {
      method: "POST",
      headers: { "X-Companion-Token": token, "Content-Type": "application/companion-input" },
      body: JSON.stringify(body),
    }).then(function (r) { if (r.status === 410 || r.status === 404) close(); }).catch(function () {});
  }

  $("back").addEventListener("click", close);
  $("newterm").addEventListener("click", function () {
    fetch("/spawn", {
      method: "POST",
      headers: { "X-Companion-Token": token, "Content-Type": "application/companion-input" },
      body: "{}",
    }).then(function () {
      // The Mac materializes the tab on its next tick; refresh shortly.
      setTimeout(refreshSessions, 900);
    }).catch(function () {});
  });
  Array.prototype.forEach.call(document.querySelectorAll("#inputs button[data-key]"), function (button) {
    button.addEventListener("click", function () { post({ key: button.getAttribute("data-key") }); });
  });
  $("send").addEventListener("click", function () {
    var box = $("textbox");
    if (box.value) { post({ text: box.value + "\r" }); box.value = ""; }
  });
  $("textbox").addEventListener("keydown", function (event) {
    if (event.key === "Enter") { event.preventDefault(); $("send").click(); }
  });
  $("gridwrap").addEventListener("touchstart", function () { lastTouch = Date.now(); }, { passive: true });
  $("gridwrap").addEventListener("touchmove", function () { lastTouch = Date.now(); }, { passive: true });
  $("gridwrap").addEventListener("wheel", function () { lastTouch = Date.now(); }, { passive: true });
  // Momentum scrolling keeps firing after the finger lifts; only scrolls we
  // did not cause ourselves count as the user looking around. A scroll still
  // sitting at the programmed position is ours (events for one programmatic
  // move can be coalesced or duplicated, so match by position, not count).
  // Floating chevron back to the live screen: visible whenever the view
  // sits meaningfully above the bottom (history browsing), hidden at tail.
  function updateJumpLive() {
    var wrap = $("gridwrap");
    var above = wrap.scrollHeight - wrap.clientHeight - wrap.scrollTop;
    $("jumplive").classList.toggle("hidden", above < 40);
  }
  $("jumplive").addEventListener("click", function () {
    var wrap = $("gridwrap");
    // Clearing the touch suppression lets follow() re-engage immediately.
    lastTouch = 0;
    wrap.scrollTop = wrap.scrollHeight;
    progScroll = { top: wrap.scrollTop, left: wrap.scrollLeft };
    updateJumpLive();
  });
  $("gridwrap").addEventListener("scroll", function () {
    var wrap = $("gridwrap");
    updateJumpLive();
    if (progScroll
        && Math.abs(wrap.scrollTop - progScroll.top) < 1
        && Math.abs(wrap.scrollLeft - progScroll.left) < 1) return;
    progScroll = null;
    lastTouch = Date.now();
  }, { passive: true });
  window.addEventListener("resize", function () {
    fitFor = 0;
    if (lastSnap) render(lastSnap);
  });
  // A+/A- move an absolute target size starting from what is on screen, so
  // every press lands within [5,18] and changes exactly what is visible —
  // no offset that can strand outside the clamp when the fit changes.
  function nudgeZoom(delta) {
    var base = userSize || lastSize || 11;
    var next = Math.max(5, Math.min(18, base + delta));
    if (next === base && userSize) return;
    userSize = next;
    storePref("st-size", String(userSize));
    if (lastSnap) { fitFor = 0; render(lastSnap); }
  }
  $("zoomin").addEventListener("click", function () { nudgeZoom(1); });
  $("zoomout").addEventListener("click", function () { nudgeZoom(-1); });
  $("padtoggle").addEventListener("click", function () {
    var compact = $("inputs").classList.toggle("compact");
    storePref("st-pad", compact ? "1" : "0");
  });

  refreshSessions();
  // Always poll: transition detection (markAttention) must keep running
  // while a terminal is open, so other rooms' finishes surface as banners.
  setInterval(refreshSessions, 5000);
})();
</script>
</body>
</html>
