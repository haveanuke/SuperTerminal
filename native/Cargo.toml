[package]
name = "superterminal-native"
version = "0.1.0"
edition = "2021"
description = "SuperTerminal Native: gpui + alacritty_terminal, no webview"
publish = false

[dependencies]
# Zed's UI framework, pinned to the crates.io release proven by the spike
# (2026-08-19). The "runtime_shaders" feature makes gpui compile its Metal
# shaders at runtime instead of at build time -- required on machines with
# only Command Line Tools installed (no full Xcode, so no `xcrun metal`).
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }

# Alacritty's terminal emulation core (VTE parser, grid, PTY handling),
# pinned to the spike-proven release.
alacritty_terminal = "=0.26.0"

serde = { workspace = true }
serde_json = { workspace = true }
superterminal-core = { path = "../core" }

# QR matrix for the phone-link flyout. Zero-dependency, pure Rust; all
# rendering features off — we draw the boolean module grid ourselves.
fast_qr = { version = "0.12", default-features = false }
