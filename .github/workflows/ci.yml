name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS runner: the PTY and proc_pidinfo tests are macOS-gated, and macOS
    # arm64 is the app's only target.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run lint

      - run: npx vite build

      - run: npx vitest run

      - run: cargo test --manifest-path src-tauri/Cargo.toml
